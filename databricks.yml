# This is a Declarative Automation Bundle definition for dab_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_project
  uuid: 872a48df-9dec-4e9e-95a7-f7dc9e6246a2

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-27a61fe9-b6a3.cloud.databricks.com
      root_path: /Workspace/Users/abhishek24072000@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dab
      schema: dev
    presets:
      artifacts_dynamic_version: true
  test:
    mode: production
    workspace:
      host: https://dbc-7ff35009-a1ea.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/senpaidata7@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/senpaidata7@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dab
      schema: prod
    permissions:
      - user_name: senpaidata7@gmail.com
        level: CAN_MANAGE
