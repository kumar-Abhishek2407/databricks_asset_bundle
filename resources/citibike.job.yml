# Each task uses the framework entrypoint; module selects its business script.
resources:
  jobs:
    citibike:
      name: citibike
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: Asia/Kolkata
        pause_status: UNPAUSED
      tasks:
        - task_key: citibike_bronze
          notebook_task:
            notebook_path: ../src/framework/run_pipeline.py
            source: WORKSPACE
            base_parameters:
              environment: ${var.environment}
              workspace_root: ${workspace.file_path}
              module: pipeline_modules/citibike_etl/bronze/bronze_citibike.py
          environment_key: Default

        - task_key: citibike_silver
          depends_on:
            - task_key: citibike_bronze
          notebook_task:
            notebook_path: ../src/framework/run_pipeline.py
            source: WORKSPACE
            base_parameters:
              environment: ${var.environment}
              workspace_root: ${workspace.file_path}
              module: pipeline_modules/citibike_etl/silver/silver_citybike.py
          environment_key: Default

        - task_key: citibike_gold_summary
          depends_on:
            - task_key: citibike_silver
          notebook_task:
            notebook_path: ../src/framework/run_pipeline.py
            source: WORKSPACE
            base_parameters:
              environment: ${var.environment}
              workspace_root: ${workspace.file_path}
              module: pipeline_modules/citibike_etl/gold/gold_citibike_daily_ride_summary.py
          environment_key: Default

        - task_key: citibike_gold_performance
          depends_on:
            - task_key: citibike_silver
          notebook_task:
            notebook_path: ../src/framework/run_pipeline.py
            source: WORKSPACE
            base_parameters:
              environment: ${var.environment}
              workspace_root: ${workspace.file_path}
              module: pipeline_modules/citibike_etl/gold/gold_citibike_daily_station_performance.py
          environment_key: Default

      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
            dependencies:
              - ../dist/*.whl
      performance_target: PERFORMANCE_OPTIMIZED
