[project]
name = "dab_project"
version = "0.0.2"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "ruff",
    "databricks-connect>=16.4,<16.5",
    "ipykernel",
]

# Source files are synced to the workspace by DABs; a wheel is not required
# for these notebook tasks. src is an ordinary importable Python package.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
